name: CI — Performance budget

on:
  push:
    branches: [master]
    paths:
      - "platform/frontend/**"
  pull_request:
    branches: [master]
    paths:
      - "platform/frontend/**"

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: platform/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VAULT_ROOT: ${{ github.workspace }}

      - name: Size limit
        run: npm run size-limit

      - name: Iniciar servidor para Lighthouse
        run: npm run start &
        env:
          PORT: 3000

      - name: Esperar servidor
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Lighthouse CI
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
